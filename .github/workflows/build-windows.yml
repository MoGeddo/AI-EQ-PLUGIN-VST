name: build-windows

# Builds the VST3 on a real Windows machine and wraps it in the installer, so the
# .exe comes out of CI instead of needing Visual Studio on a laptop.
#
# On failure the full output is pushed to the `ci/logs` branch, because the build
# logs themselves live on a storage host that not every client can reach.
on:
  push:
    branches: ['arena/**', 'main']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # release notes diff against the previous tag

      # The version lives in four files and a release is only correct when they
      # agree; check before spending six minutes compiling.
      - name: Check the version is consistent
        run: python installer/bump_version.py --check

      # JUCE 8.0.4 is ~250 MB to fetch; caching makes a re-run start at the
      # compile step instead of the download.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.4-windows

      # One code path for CI and for the user's machine: the same script that
      # detects the installed Visual Studio, builds, and runs the 18 gates.
      - name: Build the plugin
        run: |
          $ProgressPreference = 'SilentlyContinue'
          & pwsh -NoProfile -File ./plugin/build_windows.ps1 2>&1 |
              Tee-Object -FilePath build.log
          "`n=== plugin build exit: $LASTEXITCODE ===" | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 100 | Out-File -Encoding utf8 $env:GITHUB_STEP_SUMMARY -Append
            throw "the plugin build or its gates failed"
          }

      - name: Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Installer
        run: |
          # *>&1 merges Write-Host (the information stream) into the log: without
          # it the packaging step fails silently in CI
          & pwsh -NoProfile -File ./installer/build_installer.ps1 -SkipBuild -Version 1.2.6 *>&1 |
              Tee-Object -FilePath build.log -Append
          "`n=== installer exit: $LASTEXITCODE ===" | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 60 | Out-File -Encoding utf8 $env:GITHUB_STEP_SUMMARY -Append
            throw "packaging failed"
          }

      # The screenshot is the interface, rendered by the interface.  It is uploaded
      # even when the packaging step fails, because it is also the evidence that the
      # Arabic in the window is shaped and not a row of boxes.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEQ_UI_Screenshot
          path: dist/ui/*
          if-no-files-found: warn

      # Artifacts live on a storage host this project's own tooling cannot always
      # reach, so the rendered window is also parked on a branch - the same reason
      # the build log goes to ci/logs.
      - name: Park the screenshot on a branch
        if: always()
        run: |
          if (-not (Test-Path "dist/ui/*.png")) { Write-Host "no screenshot to park"; exit 0 }
          New-Item -ItemType Directory -Force -Path ci-ui | Out-Null
          Copy-Item dist/ui/* ci-ui/ -Force
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci/ui
          git add -f ci-ui
          git commit -m "screenshot for run $env:GITHUB_RUN_ID"
          git push --force origin ci/ui

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AEQ_Restore_Setup
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

      # The Actions artifact is the normal way to get the .exe out of CI.  It
      # lives on a storage host that some clients cannot reach, so a commit that
      # says [exe] in its message also parks the setup on the ci/artifacts
      # branch, where plain git can fetch it.
      - name: Park the setup on a branch
        if: success() && contains(github.event.head_commit.message, '[exe]')
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          Copy-Item dist/*.exe ci-artifacts/ -Force
          Copy-Item dist/*.sha256 ci-artifacts/ -Force
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci/artifacts
          git add -f ci-artifacts
          git commit -m "setup for run $env:GITHUB_RUN_ID"
          git push --force origin ci/artifacts


      # ---------------------------------------------------------------- release
      # Every green build tries to publish its version under Releases, so the user
      # downloads the .exe from one place and sees the versions pile up one after
      # another.  A version is published exactly once: if v1.1.0 already exists and
      # the code changed, this step says so instead of silently replacing the file
      # under a version number people have already downloaded (bump
      # installer/AEQ_Restore.iss and CMakeLists.txt to cut a new release).
      - name: Publish the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          # a native command that exits non-zero is data here, not an exception
          $PSNativeCommandUseErrorActionPreference = $false
          $iss = Get-Content installer/AEQ_Restore.iss -Raw
          $m = [regex]::Match($iss, 'AppVersion\s+"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $m.Success) { throw "cannot read AppVersion from installer/AEQ_Restore.iss" }
          $v = $m.Groups[1].Value
          Write-Host "version: $v"

          gh release view "v$v" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$v is already published - bump the version to cut a new release"
            exit 0
          }

          # the .sha256 file is "<hash>  <filename>"; only the hash belongs in the notes
          $sha  = ((Get-Content dist/*.sha256 -Raw).Trim() -split '\s+')[0]
          $size = [math]::Round((Get-Item dist/*.exe).Length / 1MB, 2)
          $prev = (git describe --tags --abbrev=0 2>$null)
          if ($prev) {
            Write-Host "changes since $prev"
            $changes = (git log --pretty=format:"- %s" "$prev..HEAD") -join "`n"
          } else {
            $changes = (git log --pretty=format:"- %s" -15) -join "`n"
          }
          if (-not $changes) { $changes = "- (no commits listed)" }

          $notes = @"
          ## AEQ Restore $v — ويندوز

          installer واحد: VST3 + نسخة مستقلة. دوس **Next → Next → Install** وخلاص.

          > النسخة **مش موقّعة بشهادة**، فويندوز هيقول "Unknown publisher" →
          > **More info → Run anyway**. ده متوقع، مش عيب في الـinstaller.

          | | |
          |---|---|
          | الملف | ``AEQ_Restore_Setup_$v.exe`` (``$size MB``) |
          | SHA-256 | ``$sha`` |
          | مكان الـVST3 | ``C:\Program Files\Common Files\VST3\AEQ Restore.vst3`` |

          ### اللي اتغيّر في الإصدار ده

          $changes

          ### التحقق بعد التنزيل

          ```powershell
          Get-FileHash .\AEQ_Restore_Setup_$v.exe -Algorithm SHA256
          ```

          البناء والبوابات: [run $env:GITHUB_RUN_ID]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)
          على ``$($env:GITHUB_SHA.Substring(0,12))`` — كل بوابات القبول ناجحة قبل النشر.
          "@

          $notes | Out-File -Encoding utf8 release-notes.md
          gh release create "v$v" dist/*.exe dist/*.sha256 --title "AEQ Restore $v" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          Write-Host "published v$v"

      - name: Publish the log on failure
        if: failure()
        run: |
          if (-not (Test-Path build.log)) { "nothing was captured" | Out-File build.log }
          Copy-Item build.log ci-failure.log -Force
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci/logs
          git add -f ci-failure.log
          git commit -m "ci log for run $env:GITHUB_RUN_ID ($env:GITHUB_SHA)"
          git push --force origin ci/logs
